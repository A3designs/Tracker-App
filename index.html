<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 0;
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: antiquewhite;
        }

        .container {
            padding-top: 70px;
        }

        #col {
            background-color: rgba(250, 235, 215, 0.6);
            min-height: 450px;
            width: 90%;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        h3 {
            font-weight: 800;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-spacing: 0 10px;
            text-align: center;
        }

        th {
            padding: 12px;
            background-color: #b39c43;
            color: white;
        }

        td {
            padding: 12px 8px;
            background-color: rgba(255, 255, 255, 0.6);
            vertical-align: middle;
        }

        .completed {
            color: green;
            font-weight: bold;
            text-decoration: line-through;
        }

        .pending {
            color: #d18a00;
            font-weight: bold;
        }

        .edit-input {
            min-width: 100px;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-10" id="col">

                <h3 class="text-center pt-4">TASK MANAGEMENT</h3>

                <!-- Add TASK -->
                <div class="pt-4 d-flex gap-3 m-3">

                    <input type="text" id="inputTitle"
                        class="form-control"
                        placeholder="Enter Your Task Title...">

                    <input type="text" id="inputDis"
                        class="form-control"
                        placeholder="Enter Your Task Description...">

                    <button class="btn btn-outline-dark"
                        onclick="add()">
                        ADD
                    </button>

                </div>

                <!-- Displuy tsk -->
                <div class="p-3">

                    <table>

                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th colspan="2">Action</th>
                            </tr>
                        </thead>

                        <tbody id="output">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script>

        let tasks = [];

        // Add task
        function add() {

            const title = document.getElementById("inputTitle").value;
            const dis = document.getElementById("inputDis").value;

            if (title.trim() == "" || dis.trim() == "") {

                alert("Please fill all fields!");

            } else {

                const obj = {
                    title: title,
                    dis: dis,
                    status: "Pending"
                };

                tasks.push(obj);

                display();

                document.getElementById("inputTitle").value = "";
                document.getElementById("inputDis").value = "";

            }

        }


        // displa Task
        function display() {

            let data = "";

            tasks.forEach((item, index) => {

                data += `
                    <tr>

                        <td class="fw-4">
                            ${item.title}
                        </td>

                        <td>
                            ${item.dis}
                        </td>

                        <td>
                            <button class="btn btn-sm btn-warning"
                                onclick="changeStatus(${index})">
                                ${item.status}
                            </button>
                        </td>

                        <td>

                            <button class="btn btn-info btn-sm"
                                onclick="edit(${index})">

                                <i class="fa-solid fa-pen"></i> EDIT

                            </button>

                        </td>

                        <td>

                            <button class="btn btn-danger btn-sm"
                                onclick="cleardata(${index})">

                                <i class="fa-solid fa-trash"></i> DELETE

                            </button>

                        </td>

                    </tr>
                `;

            });

            document.getElementById("output").innerHTML = data;

        }


        // Edit
        function edit(index) {

            let newTitle = prompt("Enter new title", tasks[index].title);
            if (newTitle ===null || newTitle.trim() ==""){
                return;
            }
            let newDis= prompt("Enter new description", tasks[index].dis);

            if (newDis ===null || newDis.trim()=="") {
                return;
            }

            // Update Dat
            tasks[index].title = newTitle;
            tasks[index].dis = newDis;

            display();

            alert("Task Updated Successfully!");

        }


        // Update status
        function changeStatus(index) {

            if (tasks[index].status == "Pending") {

                tasks[index].status = "Completed";

            } else {

                tasks[index].status = "Pending";

            }

            display();

        }


        // Delete
        function cleardata(index) {

            let confirmDelete = confirm("Are you sure to delete this task?");

            if (confirmDelete) {

                tasks.splice(index, 1);

                display();

            }

        }

    </script>

</body>

</html>
